<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Decode Stack · 解码组件</title>
  <link rel="stylesheet" href="style.css?v=086-release1">
  <script src="i18n.js?v=086-release1" defer></script>
  <script src="app.js?v=086-release1" defer></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">RK3588 · DECODE STACK</p><h1 data-i18n="heading">解码组件</h1><p id="version">正在读取模块…</p></div><div class="header-actions"><button id="language" type="button">English</button><button id="refresh" type="button" data-i18n="refresh">刷新状态</button></div></header>
    <section id="notice" class="notice" aria-live="polite">正在连接 KSU WebUI…</section>
    <section class="summary" data-i18n-aria="wholeAria" aria-label="整包状态">
      <div><h2 data-i18n="wholeLabel">整包启用</h2><p data-i18n="wholeDescription">关闭并重启后恢复原厂解码组件，保留分项选择。</p><p id="whole-state" class="detail"></p></div>
      <button id="whole" type="button" role="switch" aria-checked="false" aria-label="整包启用" disabled><span></span></button>
    </section>
    <p id="changes" class="detail" aria-live="polite"></p>
    <p class="legend" data-i18n="legend">下级放在依赖项下面。开关保留已选状态；灰色表示依赖未满足或整包停用。开启子项会自动补齐依赖，关闭上级会保留下级选择。</p>
    <div id="components"></div>
    <footer><p data-i18n="footerReboot">保存后请从系统菜单重启。不会热替换运行中的库。</p><p data-i18n="footerScope">开关只管理 Decode Stack；Mali、Yamby、LSPosed 和 Frame Guard 保持独立。</p><p id="health">启动检查：等待读取</p></footer>
  </main>
</body>
</html>
